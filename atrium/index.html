  $('#demoBanner').innerHTML = S.demo ? `<div class="demo-banner"><span><b>Dados de exemplo.</b> Importe os backups dos seus apps para ver os seus.</span><button class="btn sm primary" data-go="fontes">Ir para Fontes</button></div>` : '';
  document.querySelectorAll('[role="tab"]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  ({ hoje: renderHoje, semana: renderSemana, ligacoes: renderLigacoes, fontes: renderFontes })[tab](S);
}
const openBtn = (app, label) => { const u = store.appUrls[app]; return u ? `<a class="btn sm ac-open" href="${esc(u)}" target="_blank" rel="noopener">${label}</a>` : ''; };
const APPN = { cog: 'Cognitio', vol: 'Volumen', mem: 'Memento', atr: 'Atrium' };
function freshStrip(S) {
  if (S.demo) return '';
  const chips = ['memento', 'volumen', 'cognitio'].map(app => {
    const f = freshness(app);
    if (!f) return `<button class="fresh missing" data-go="fontes"><i class="${app.slice(0, 3)}"></i>${NAMES[app]}: sem dados</button>`;
    return `<button class="fresh${f.stale ? ' stale' : ''}" data-go="fontes" title="Dados de ${fmtDT(Date.now() - f.hours * HOUR)}"><i class="${app.slice(0, 3)}"></i>${NAMES[app]} ${f.label}</button>`;
  }).join('');
  const stale = ['memento', 'volumen', 'cognitio'].filter(a => freshness(a)?.stale);
  return `<div class="freshbar${stale.length ? ' warn' : ''}">${stale.length ? `<p>⚠ ${stale.map(a => NAMES[a]).join(', ')} ${stale.length === 1 ? 'está' : 'estão'} há mais de ${STALE_HOURS} h sem atualizar. A ação do dia pode estar errada.</p>` : ''}<div class="freshchips">${chips}</div></div>`;
}

/* ---------- Hoje ---------- */
function renderHoje(S) {
  const m = S.memento, name = m && m.name ? m.name.split(' ')[0] : '';
  const h = new Date().getHours(), sal = h < 5 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  let life = '';
  if (m && /^\d{4}-\d{2}-\d{2}$/.test(m.birth)) {
    const days = Math.floor((Date.now() - Date.parse(m.birth + 'T00:00:00')) / DAY);
    life = `<p class="life">Dia <b>${days.toLocaleString('pt-BR')}</b> da sua vida.</p>`;
  }
  const act = currentAction(S), done = doneToday(), atrStreak = streak(history.map(x => x.date));
  const st = todayState();
  let actHtml;
  if (!act) actHtml = `<section class="card action"><p class="eyebrow">Sua próxima ação do dia</p><p class="act-text">Nada pendente nos três apps.</p><p class="act-why">Sem gargalos, sem revisões vencidas e sem leitura em andamento. Escolha um território novo no Cognitio.</p></section>`;
  else if (st.doneAt && !st.more) actHtml = `<section class="card action done"><div class="checkmark" aria-hidden="true">✓</div><p class="eyebrow">Ação do dia feita às ${fmtTime(st.doneAt)}</p><p class="act-text">${esc(st.doneText)}</p>
      <p class="act-why">${atrStreak > 1 ? `🔥 ${atrStreak} dias seguidos cumprindo a ação do dia.` : 'Primeiro dia da sequência. Amanhã tem outra.'}</p>
      <div class="act-row"><button class="btn" data-more>Mais uma ação</button></div></section>`;
  else actHtml = `<section class="card action"><p class="eyebrow">Sua próxima ação do dia${done.length ? ` · ${done.length} feita${done.length > 1 ? 's' : ''} hoje` : ''}</p>
      <ul class="act-parts">${act.parts.map(p => `<li><span class="chip ${p.app}">${APPN[p.app]}</span><span>${esc(p.label)}</span></li>`).join('')}</ul>
      <p class="act-why">Por quê: ${esc(act.why.join('; '))}. Cerca de ${fmtMin(act.min)}.</p>
      <div class="act-row"><button class="btn primary big" data-did>✓ Fiz</button>${act.total > 1 ? '<button class="btn" data-swap>Trocar</button>' : ''}</div></section>`;

  // Contexto compacto: um número por app
  const q = cogQueue(S.cognitio), cur = volCurrent(S.volumen), d = m && m.daylog[0];
  const f = app => { const x = freshness(app); return x ? `<small class="${x.stale ? 'stale-t' : ''}">${x.label}</small>` : ''; };
  const ctx = `<div class="ctx">
    <article class="card ctx-c mem"><p class="ac-name">MEMENTO ${f('memento')}</p>${m ? d ? `<p class="ctx-v">${d.score === null ? '–' : d.score + '%'}</p><p class="ctx-l">execução em ${fmtDate(keyToDate(d.date))}${d.checkTotal ? `, checklist ${d.checkDone}/${d.checkTotal}` : ''}</p>` : '<p class="ctx-l">Nenhum dia registrado.</p>' : '<p class="ctx-l">Sem dados.</p>'}${openBtn('memento', 'Abrir')}</article>
    <article class="card ctx-c vol"><p class="ac-name">VOLUMEN ${f('volumen')}</p>${cur ? `<p class="ctx-v">${cur.total ? Math.round(cur.current / cur.total * 100) + '%' : '–'}</p><p class="ctx-l">${esc(clip(cur.title, 40))}</p>` : `<p class="ctx-l">${S.volumen ? 'Nada em andamento.' : 'Sem dados.'}</p>`}${openBtn('volumen', 'Abrir')}</article>
    <article class="card ctx-c cog"><p class="ac-name">COGNITIO ${f('cognitio')}</p>${S.cognitio ? `<p class="ctx-v">${q.due}</p><p class="ctx-l">${q.due === 1 ? 'revisão vencida' : 'revisões vencidas'}${q.weak ? `, ${q.weak} 🎯` : ''}</p>` : '<p class="ctx-l">Sem dados.</p>'}${openBtn('cognitio', 'Abrir')}</article>
  </div>`;

  // Semana em uma linha
  const wk = weekKey(), from = mondayOf(today()), elapsed = Math.round((keyToDate(today()) - keyToDate(from)) / DAY) + 1;
  const goals = (store.goals[wk] || []).map(g => goalStatus(S, g, from, today(), elapsed)).filter(Boolean);
  const wkLine = goals.length
    ? `<button class="card weekline" data-go="semana"><span>Metas da semana</span><b>${goals.filter(g => g.st === 'ok').length} cumpridas, ${goals.filter(g => g.st === 'track').length} no caminho, ${goals.filter(g => g.st === 'risk' || g.st === 'fail').length} em risco</b><em>›</em></button>`
    : `<button class="card weekline" data-go="semana"><span>Semana ${wk.split('-S')[1]}</span><b>Nenhuma meta definida. Defina de 1 a 3 metas.</b><em>›</em></button>`;

  view().innerHTML = `<div class="view">${life}<h2 class="greet">${sal}${name ? `, ${esc(name)}` : ''}.</h2>${freshStrip(S)}${actHtml}${wkLine}${ctx}</div>`;
}

/* ---------- Semana: ritual, metas, tendências, sequências, ritmo ---------- */
function trendRow(label, now, prev, { unit = '', pp = false, lowerBetter = false, fmt = v => v } = {}) {
  if (now === null || now === undefined) return '';
  let delta = '', cls = 'flat';
  if (prev === null || prev === undefined) delta = 'sem base anterior';
  else {
    const d = now - prev;
    if (d === 0) delta = '→ igual à semana anterior';
    else {
      const up = d > 0; cls = (up !== lowerBetter) ? 'good' : 'bad';
      const pct = !pp && prev ? ` (${up ? '+' : ''}${Math.round(d / prev * 100)}%)` : '';
      delta = `${up ? '↑' : '↓'} ${pp ? Math.abs(d) + ' p.p.' : (up ? '+' : '−') + fmt(Math.abs(d)) + unit}${pct}${!prev && !pp ? ' (antes: 0)' : ''}`;
    }
  }
  return `<div class="trend"><span class="tl">${label}</span><b>${fmt(now)}${unit}</b><em class="${cls}">${delta}</em></div>`;
}
function renderSemana(S) {
  const t = today(), wk = weekKey(), from = mondayOf(t), elapsed = Math.round((keyToDate(t) - keyToDate(from)) / DAY) + 1;
  const W = metrics(S, from, t);
  // --- Ritual: compromisso do Memento x realidade
  const m = S.memento;
  let commit = null, intent = null;
  if (m) {
    const keys = Object.keys(m.weekReviews).filter(k => /^\d{4}-S\d+$/.test(k)).sort((a, b) => { const [ya, wa] = a.split('-S').map(Number), [yb, wb] = b.split('-S').map(Number); return ya - yb || wa - wb; });
    const k = keys.includes(wk) ? wk : keys.filter(x => x <= wk).pop();
    if (k && m.weekReviews[k] && m.weekReviews[k].commit) commit = { text: m.weekReviews[k].commit, key: k };
    const im = m.memories.find(x => x.scope === 'Semana' && x.wk === wk); if (im) intent = im.title || clip(im.text, 140);
  }
  const reality = [];
  if (W.desvio !== undefined) reality.push(`<li><b style="color:var(--mem)">${fmtMin(W.desvio)}</b> de desvio</li><li><b style="color:var(--vol)">${fmtMin(W.prod)}</b> de projetos</li>`);
  if (W.pillMin !== undefined) reality.push(`<li><b style="color:var(--cog)">${fmtMin(W.pillMin)}</b> de prática, ${pl(W.notes, 'ficha', 'fichas')}</li>`);
  if (W.pages !== undefined) reality.push(`<li><b style="color:var(--vol)">${W.pages}</b> páginas lidas</li>`);
  if (W.exec !== undefined && W.exec !== null) reality.push(`<li><b>${W.exec}%</b> de execução em ${pl(W.memDays, 'dia registrado', 'dias registrados')}</li>`);
  const ritual = `<section class="card ritual"><p class="eyebrow">Semana ${wk.split('-S')[1]}, dia ${elapsed} de 7</p><h3>Estou cumprindo o que prometi?</h3>
    <div class="vs"><div class="vs-l"><small>Promessa</small>${commit ? `<p class="promise">“${esc(commit.text)}”</p><p class="src">Memento, revisão ${esc(commit.key.split('-S')[1] ? 'da semana ' + commit.key.split('-S')[1] : '')}</p>` : '<p class="promise muted">Sem compromisso registrado no Memento para esta semana.</p>'}
      ${intent ? `<p class="src">Intenção da semana: ${esc(intent)}</p>` : ''}</div>
      <div class="vs-r"><small>Realidade desde segunda</small>${reality.length ? `<ul>${reality.join('')}</ul>` : '<p class="muted">Sem dados desta semana.</p>'}</div></div></section>`;

  // --- Metas
  const list = store.goals[wk] || [];
  const goalsHtml = list.map(g => { const s = goalStatus(S, g, from, t, elapsed); if (!s) return ''; const u = s.def.dir < 0 ? '' : '';
    return `<li class="goal ${s.st}"><div class="g-top"><span>${s.def.dir < 0 ? 'Até' : ''} <b>${g.target}</b> ${esc(s.def.label)}</span><em>${ST_LABEL[s.st]}</em></div>
      <div class="g-bar"><i style="width:${s.pct}%"></i></div><div class="g-foot"><span>Agora: <b>${s.val}${u}</b></span><button class="link" data-goal-rm="${g.id}">Remover</button></div></li>`; }).join('');
  const avail = Object.entries(GOALS).filter(([k, d]) => APP_OK(S, d.app));
  const PREV_WK = (() => { const pm = addDays(from, -7), pe = addDays(from, -1), pk = weekKey(keyToDate(pm)); const pg = (store.goals[pk] || []).map(g => goalStatus(S, g, pm, pe, 7)).filter(Boolean); return pg.length ? `<p class="prevgoals">Semana passada: <b>${pg.filter(x => x.st === 'ok').length} de ${pg.length}</b> metas cumpridas.</p>` : ''; })();
  const goalsSec = `<section class="card goals"><div class="g-head"><h3>Metas da semana</h3><span>${list.length}/3</span></div>
    ${list.length ? `<ul>${goalsHtml}</ul>` : '<p class="muted">Metas medidas pelos próprios dados dos apps. Escolha de 1 a 3.</p>'}
    ${list.length < 3 ? `<div class="g-add"><input id="gTarget" type="number" min="0" step="1" inputmode="numeric" placeholder="Nº" aria-label="Valor da meta"><select id="gMetric" aria-label="Tipo de meta">${avail.map(([k, d]) => `<option value="${k}">${d.label}</option>`).join('')}</select><button class="btn primary" id="gAdd">Adicionar</button></div>` : ''}
    ${PREV_WK}</section>`;

  // --- Tendências: últimos 7 dias x 7 anteriores
  const A = metrics(S, addDays(t, -6), t), B = metrics(S, addDays(t, -13), addDays(t, -7));
  const trends = [
    S.memento ? trendRow('Execução média (Memento)', A.exec, B.exec, { unit: '%', pp: true }) : '',
    S.memento ? trendRow('Projetos (Memento)', A.prod, B.prod, { fmt: fmtMin }) : '',
    S.memento ? trendRow('Desvio (Memento)', A.desvio, B.desvio, { fmt: fmtMin, lowerBetter: true }) : '',
    S.memento ? trendRow('Dias registrados', A.memDays, B.memDays) : '',
    S.cognitio ? trendRow('Prática (Cognitio)', A.pillMin, B.pillMin, { fmt: fmtMin }) : '',
    S.cognitio ? trendRow('Fichas escritas', A.notes, B.notes) : '',
    S.volumen ? trendRow('Páginas lidas (Volumen)', A.pages, B.pages) : '',
    S.memento ? trendRow('Gastos registrados', A.spent, B.spent, { fmt: v => brl(v), lowerBetter: true }) : ''
  ].join('');
  // --- Sequências
  const sMem = S.memento ? streak(S.memento.daylog.map(x => x.date)) : null;
  const sCog = S.cognitio ? streak(S.cognitio.pillLog.map(l => dayKey(l.at))) : null;
  const sAtr = streak(history.map(x => x.date));
  const streaks = `<div class="streaks">${sMem !== null ? `<div><b>${sMem ? '🔥 ' : ''}${sMem}</b><small>${sMem === 1 ? 'dia' : 'dias'} seguidos registrando no Memento</small></div>` : ''}${sCog !== null ? `<div><b>${sCog ? '🔥 ' : ''}${sCog}</b><small>${sCog === 1 ? 'dia' : 'dias'} seguidos com pílulas</small></div>` : ''}<div><b>${sAtr ? '🔥 ' : ''}${sAtr}</b><small>${sAtr === 1 ? 'dia' : 'dias'} cumprindo a ação do dia</small></div></div>`;

  // --- Ritmo (mapa de calor)
  const n = range, days = Array.from({ length: n }, (_, i) => addDays(t, -(n - 1 - i)));
  const rows = [];
  if (S.cognitio) { const by = {}; S.cognitio.pillLog.forEach(l => { const k = dayKey(l.at); by[k] = (by[k] || 0) + l.minutes; }); rows.push({ cls: 'cog', label: 'Cognitio', unit: 'min de pílulas', vals: days.map(d => by[d] || 0) }); }
  if (S.volumen) { const by = {}; S.volumen.items.forEach(i => i.sessions.forEach(s => { if (s.delta > 0) by[s.date] = (by[s.date] || 0) + s.delta; })); rows.push({ cls: 'vol', label: 'Volumen', unit: 'de progresso', vals: days.map(d => by[d] || 0) }); }
  if (S.memento) { const by = {}; S.memento.daylog.forEach(x => { if (x.score !== null) by[x.date] = x.score; }); rows.push({ cls: 'mem', label: 'Memento', unit: '% de execução', vals: days.map(d => by[d] ?? null), abs: 100 }); }
  if (history.length) { const by = {}; history.forEach(x => { by[x.date] = (by[x.date] || 0) + 1; }); rows.push({ cls: 'atr', label: 'Atrium', unit: 'ações feitas', vals: days.map(d => by[d] || 0) }); }
  const heat = rows.length ? `<div class="heat-grid" style="grid-template-columns:auto repeat(${n},minmax(0,1fr))">
      ${rows.map(r => { const max = r.abs || Math.max(1, ...r.vals.map(v => v || 0));
        return `<span class="heat-label ${r.cls}">${r.label}</span>` + r.vals.map((v, i) => `<span class="cell ${r.cls}${days[i] === t ? ' today' : ''}"${v ? ` data-v style="--p:${Math.round(18 + 82 * v / max)}"` : ''} title="${fmtDate(keyToDate(days[i]))}: ${v === null ? 'sem registro' : v + ' ' + r.unit}"></span>`).join(''); }).join('')}
      <span></span>${days.map((d, i) => `<span class="dlabel">${n === 7 ? keyToDate(d).toLocaleDateString('pt-BR', { weekday: 'narrow' }) : (i % 5 === 0 || i === n - 1) ? d.slice(8) : ''}</span>`).join('')}
    </div>` : '<p class="empty-note">Importe ao menos um backup para ver o ritmo.</p>';

  view().innerHTML = `<div class="view"><div class="sec-head"><div><h2>Semana</h2><p>Promessa, metas e tendência.</p></div></div>
    ${freshStrip(S)}${ritual}${goalsSec}
    <section class="card trends"><h3>Tendência</h3><p class="muted">Últimos 7 dias comparados com os 7 anteriores.</p>${trends || '<p class="muted">Sem dados suficientes.</p>'}</section>
    ${streaks}
    <section class="card heat"><div class="g-head"><h3>Ritmo</h3><div class="seg" id="rangeSeg"><button data-r="7" aria-pressed="${n === 7}">7 dias</button><button data-r="30" aria-pressed="${n === 30}">30 dias</button></div></div>${heat}
      <p class="heat-note">Cada linha usa a sua própria escala.</p></section></div>`;
}

/* ---------- Ligações: por categoria, com ação proposta ---------- */
function renderLigacoes(S) {
  if (!S.volumen || !S.cognitio) {
    view().innerHTML = `<div class="view"><div class="sec-head"><div><h2>Ligações</h2><p>Leituras do Volumen ligadas a áreas do Cognitio.</p></div></div>
      <section class="card panel"><p>Para ligar leituras a áreas de estudo, o Atrium precisa dos backups do <b>Volumen</b> e do <b>Cognitio</b>.</p><div class="row"><button class="btn primary" data-go="fontes">Importar backups</button></div></section></div>`;
    return;
  }
  const all = linkRows(S);
  const linked = all.filter(r => r.link), practiced = linked.filter(r => r.verdict === 2).length, notesOnly = linked.filter(r => r.verdict === 1).length, readOnly = linked.filter(r => r.verdict === 0).length;
  const F = { andamento: r => r.item.status === 'in_progress', concluidos: r => r.item.status === 'done', soltos: r => !r.link && r.item.status !== 'not_started', todos: () => true };
  const rows = all.filter(F[linkFilter]);
  const groups = new Map();
  rows.forEach(r => { const k = r.item.category || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  const order = [...groups.keys()].sort((a, b) => (!a) - (!b) || groups.get(b).length - groups.get(a).length || a.localeCompare(b));
  const areaOpts = (sel, ph) => `<option value="">${ph}</option>` + S.cognitio.fields.map(f => `<optgroup label="${esc(f.icon + ' ' + f.title)}">${S.cognitio.areas.filter(a => a.fieldId === f.id).map(a => `<option value="${a.id}"${a.id === sel ? ' selected' : ''}>${esc(a.title)}</option>`).join('')}</optgroup>`).join('');
  const VT = ['Só leitura', 'Virou fichas', 'Virou prática'];
  const itemHtml = r => {
    const it = r.item, sug = !r.link && suggestArea(S.cognitio, it), pa = proposeAction(r), pct = it.total ? Math.round(it.current / it.total * 100) : 0;
    return `<article class="card litem">${it.thumb ? `<img src="${esc(it.thumb)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${TYPE_ICON[it.type] || '📘'}'}))">` : `<div class="ph">${TYPE_ICON[it.type] || '📘'}</div>`}
      <div class="li-main">
        <div class="li-top"><div style="min-width:0"><p class="li-title">${esc(it.title)}</p><p class="li-sub">${esc(it.author || '')}${it.total ? `${it.author ? ' · ' : ''}${pct}%` : ''}</p></div>
          ${r.link ? `<span class="verdict v${r.verdict}">${VT[r.verdict]}</span>` : ''}</div>
        ${r.link ? `<p class="li-proof">${esc(r.area.title)}: ${pl(r.notes, 'ficha', 'fichas')}, ${pl(r.pills, 'pílula resolvida', 'pílulas resolvidas')}.</p>` : ''}
        ${pa ? `<div class="li-act"><span>→ ${esc(pa.label)}</span><button class="btn sm" data-today="${esc(it.id)}">Fazer hoje</button></div>` : ''}
        ${sug ? `<button class="suggest" data-sug="${esc(it.id)}" data-area="${sug.a.id}">Ligar a ${esc(sug.a.title)}? <small>(${sug.why})</small></button>` : ''}
        <div class="li-link"><select data-link="${esc(it.id)}" aria-label="Área do Cognitio para ${esc(it.title)}">${areaOpts(r.link ? r.link.areaId : '', 'Ligar a uma área…')}</select>${r.link ? `<button class="btn sm" data-unlink="${esc(it.id)}">Desligar</button>` : ''}</div>
      </div></article>`;
  };
  const dupsNote = S.volumen.dups && S.volumen.dups.length ? `<p class="dupnote">${pl(S.volumen.dups.length, 'item repetido no Volumen foi juntado', 'itens repetidos no Volumen foram juntados')}: ${S.volumen.dups.map(x => `“${esc(clip(x, 40))}”`).join(', ')}. Vale apagar a cópia no próprio Volumen.</p>` : '';
  view().innerHTML = `<div class="view"><div class="sec-head"><div><h2>Ligações</h2><p>O que você lê virou ficha e pílula, ou ficou só em “lido”?</p></div></div>
    <section class="card linksum"><div><b>${linked.length}</b><small>ligadas</small></div><div><b style="color:var(--vol)">${practiced}</b><small>viraram prática</small></div><div><b style="color:var(--cog)">${notesOnly}</b><small>viraram fichas</small></div><div><b style="color:var(--mem)">${readOnly}</b><small>só leitura</small></div></section>
    ${dupsNote}
    <div class="filters">${[['andamento', 'Em andamento'], ['concluidos', 'Concluídos'], ['soltos', 'Lidos sem ligação'], ['todos', 'Todos']].map(([k, l]) => `<button data-f="${k}" aria-pressed="${linkFilter === k}">${l}</button>`).join('')}</div>
    ${order.length ? order.map(cat => {
      const g = groups.get(cat), mapped = cat && store.catMap[norm(cat)];
      return `<section class="lgroup"><div class="lg-head"><h3>${cat ? esc(cat) : 'Sem categoria'} <small>${g.length}</small></h3>
        ${cat ? `<select data-cat="${esc(cat)}" aria-label="Ligar a categoria ${esc(cat)}">${areaOpts(mapped || '', 'Ligar a categoria inteira a…')}</select>` : '<span class="lg-hint">Defina a categoria no Volumen para ligar em grupo.</span>'}</div>
        <div class="litems">${g.map(itemHtml).join('')}</div></section>`;
    }).join('') : '<p class="empty-note">Nada neste filtro.</p>'}</div>`;
}

/* ---------- Fontes ---------- */
function renderFontes() {
  const card = app => {
    const s = store.sources[app], f = freshness(app);
    return `<section class="card src ${app.slice(0, 3)}"><h3>${NAMES[app]}</h3>
      ${s ? `<p class="state">${f && f.stale ? '<span class="stale-t">⚠ Desatualizado</span> · ' : ''}Dados de <b>${f ? f.label : '–'}</b>${s.origin === 'direto' ? ' (leitura direta)' : ''}<br>Importado em ${fmtDT(s.importedAt)}</p><ul>${SUMS[app](s.data).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
        : `<p class="state">Nenhum backup importado.</p>`}
      <div><label for="url-${app}">Link para abrir o app (opcional)</label><input id="url-${app}" data-url="${app}" placeholder="https://… ou nome do arquivo .html" value="${esc(store.appUrls[app])}"></div>
      <div class="row"><button class="btn sm primary" data-import>Importar backup</button>${s ? `<button class="btn sm danger" data-clear="${app}">Remover</button>` : ''}</div></section>`;
  };
  let used = 0; try { used = ((localStorage.getItem(KEY) || '').length + (localStorage.getItem(HISTORY_KEY) || '').length) * 2; } catch {}
  const pct = Math.min(100, used / (5 * 1024 * 1024) * 100);
  view().innerHTML = `<div class="view"><div class="sec-head"><div><h2>Fontes</h2><p>De onde o Atrium tira os dados. Ele só lê: nada volta para os apps.</p></div>
      <button class="btn primary" data-import>Importar backups</button></div>
    <div class="srcs">${card('memento')}${card('volumen')}${card('cognitio')}</div>
    <section class="card panel"><h3>Como atualizar</h3><p>Exporte o backup em cada app e importe aqui; pode selecionar os três de uma vez. Acima de ${STALE_HOURS} h sem atualizar, o Atrium avisa na tela Hoje, porque a ação do dia passa a usar dados velhos.</p>
      <div class="meter"><i style="width:${pct}%"></i></div><p class="note" style="font-size:12px">${(used / 1024).toFixed(0)} KB usados pelo Atrium, de cerca de 5 MB.</p></section>
    <section class="card panel"><h3>Leitura direta (Fase 2)</h3><p>Com o Atrium e os três apps publicados no mesmo endereço (ex.: GitHub Pages), ele lê o Cognitio no localStorage e o Memento e o Volumen no IndexedDB, sem backup. ${USE_GITHUB_PAGES_ORIGIN ? '<b>Ativa:</b> a leitura acontece ao abrir e ao voltar para a aba.' : 'Para ligar de vez, mude <code>USE_GITHUB_PAGES_ORIGIN</code> para <code>true</code> no código.'}</p><div class="row"><button class="btn" id="nativeBtn">Tentar leitura direta agora</button></div></section>
    <section class="card panel"><h3>Backup do Atrium</h3><p>Guarda ligações, metas, histórico de ações, links dos apps e os resumos importados.</p><div class="row"><button class="btn" id="expBtn">Exportar backup do Atrium</button><button class="btn" id="impBtn">Importar backup do Atrium</button></div></section></div>`;
}

/* =============================================================
   MÓDULO 10 — EVENTOS
   ============================================================= */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme() { const t = document.documentElement.dataset.theme; $('#themeBtn').innerHTML = t === 'dark' ? SUN : MOON; $('#metaTheme').content = t === 'dark' ? '#0d0e12' : '#f5f0e6'; }
function go(t) { tab = t; render(); window.scrollTo({ top: 0 }); }
function burst(el) {
  const r = el.getBoundingClientRect(), colors = ['var(--mem)', 'var(--vol)', 'var(--cog)'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('i'); s.className = 'spark';
    s.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;background:${colors[i % 3]};--dx:${Math.cos(i / 18 * 6.28) * (40 + Math.random() * 40)}px;--dy:${Math.sin(i / 18 * 6.28) * (40 + Math.random() * 40)}px`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 700);
  }
}
function findItem(id) { const v = sources().volumen; return v && v.items.find(i => i.id === id || (i.aliases || []).includes(id)); }

document.addEventListener('click', e => {
  const t = e.target;
  const tb = t.closest('[data-tab]'); if (tb) return go(tb.dataset.tab);
  const g = t.closest('[data-go]'); if (g) return go(g.dataset.go);
  if (t.closest('#themeBtn')) { const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem(THEME_KEY, n); } catch {} applyTheme(); return; }
  if (t.closest('[data-import]')) return $('#fileIn').click();
  // Próxima ação
  const did = t.closest('[data-did]');
  if (did) {
    const act = currentAction(sources()); if (!act) return;
    const st = todayState();
    history.push({ id: uid(), date: today(), at: new Date().toISOString(), text: act.text, minutes: act.min, parts: act.parts.map(p => ({ app: p.app, kind: p.kind, label: p.label })) });
    persistHistory();
    Object.assign(st, { doneAt: new Date().toISOString(), doneText: act.text, more: false, variant: st.variant + 1, override: null });
    persist(); burst(did);
    const s = streak(history.map(x => x.date));
    toast(s > 1 ? `Registrado. ${s} dias seguidos.` : 'Registrado. Bom começo.');
    setTimeout(render, 250); return;
  }
  if (t.closest('[data-swap]')) { const st = todayState(); st.variant++; st.override = null; persist(); render(); return; }
  if (t.closest('[data-more]')) { const st = todayState(); st.more = true; persist(); render(); return; }
  const td = t.closest('[data-today]');
  if (td) {
    const S = sources(), row = linkRows(S).find(r => r.item.id === td.dataset.today), pa = row && proposeAction(row);
    if (!pa) return;
    const st = todayState(); st.override = { app: pa.app, kind: 'ligacao', min: pa.min, label: pa.label, why: 'escolhida por você em Ligações' }; st.variant = 0; st.more = true; persist();
    toast('Virou a sua próxima ação de hoje'); return go('hoje');
  }
  // Metas
  if (t.closest('#gAdd')) {
    const metric = $('#gMetric').value, target = Math.max(0, Math.round(num($('#gTarget').value) * 10) / 10), def = GOALS[metric];
    if (!target && def.dir > 0) { toast('Escreva um número para a meta.', true); $('#gTarget').focus(); return; }
    if (def.max && target > def.max) { toast(`O máximo para esta meta é ${def.max}.`, true); return; }
    const wk = weekKey(); store.goals[wk] = [...(store.goals[wk] || []), { id: uid(), metric, target }].slice(0, 3); persist(); render(); toast('Meta adicionada'); return;
  }
  const gr = t.closest('[data-goal-rm]'); if (gr) { const wk = weekKey(); store.goals[wk] = (store.goals[wk] || []).filter(x => x.id !== gr.dataset.goalRm); persist(); render(); return; }
  // Fontes e ligações
  const cl = t.closest('[data-clear]');
  if (cl) { if (!confirm(`Remover o resumo do ${NAMES[cl.dataset.clear]} do Atrium? O app original não é afetado.`)) return; store.sources[cl.dataset.clear] = null; persist(); render(); return; }
  const r = t.closest('[data-r]'); if (r) { range = +r.dataset.r; render(); return; }
  const f = t.closest('[data-f]'); if (f) { linkFilter = f.dataset.f; render(); return; }
  const sg = t.closest('[data-sug]'); if (sg) { const it = findItem(sg.dataset.sug); if (it) { setLink(it, sg.dataset.area); render(); toast('Ligação criada'); } return; }
  const ul = t.closest('[data-unlink]'); if (ul) { const it = findItem(ul.dataset.unlink); if (it) { setLink(it, ''); render(); } return; }
  if (t.closest('#nativeBtn')) return readNative();
  if (t.closest('#expBtn')) {
    const url = URL.createObjectURL(new Blob([JSON.stringify({ app: 'Atrium', exportedAt: new Date().toISOString(), ...store, history }, null, 2)], { type: 'application/json' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: `atrium-backup-${today()}.json` });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500); toast('Backup do Atrium exportado'); return;
  }
  if (t.closest('#impBtn')) return $('#atriumIn').click();
});
document.addEventListener('change', e => {
  const sel = e.target.closest('[data-link]');
  if (sel) { const it = findItem(sel.dataset.link); if (it) { setLink(it, sel.value); render(); if (sel.value) toast('Ligação criada'); } return; }
  const cs = e.target.closest('[data-cat]');
  if (cs) {
    const cat = cs.dataset.cat, areaId = cs.value, S = sources();
    if (areaId) store.catMap[norm(cat)] = areaId; else delete store.catMap[norm(cat)];
    let n = 0;
    if (areaId) linkRows(S).filter(r => r.item.category === cat && !r.link).forEach(r => { setLink(r.item, areaId); n++; });
    persist(); render(); if (areaId) toast(n ? `${pl(n, 'item ligado', 'itens ligados')}; novos itens de “${cat}” vão sugerir esta área` : 'Categoria mapeada'); return;
  }
  const u = e.target.closest('[data-url]');
  if (u) { const v = u.value.trim(); if (v && !safeUrl(v) && !/^[\w./-]+\.html?$/i.test(v)) { toast('Use um link https:// ou um nome de arquivo .html', true); u.value = store.appUrls[u.dataset.url]; return; } store.appUrls[u.dataset.url] = v; persist(); toast('Link salvo'); }
});
$('#fileIn').addEventListener('change', e => { const files = [...e.target.files]; e.target.value = ''; if (files.length) importFiles(files); });
$('#atriumIn').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'Atrium' || !d.sources) throw 0;
    if (!confirm('Substituir tudo o que está no Atrium por este backup?')) return;
    const { history: h, app, exportedAt, ...rest } = d;
    store = Object.assign(blank(), rest); history = Array.isArray(h) ? h : [];
    persist(); persistHistory(); render(); toast('Backup do Atrium restaurado');
  } catch { toast('Este arquivo não é um backup do Atrium.', true); }
});
if (USE_GITHUB_PAGES_ORIGIN) {
  readNative({ silent: true });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') readNative({ silent: true }); });
}
applyTheme();
render();
})();
</script>
</body>
