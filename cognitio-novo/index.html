<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
(function(){try{var t=localStorage.getItem('cognitio.theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;}catch(e){}})();

<style>
:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-theme="dark"]{
  --bg:#0d0e12; --card:#161821; --card-2:#1c1f29; --line:#252a37; --line-strong:#353b4b;
  --text:#ece6d8; --muted:#a3a19a; --faint:#737782; --prose:#d6d0c2;
  --amber:#f0a030; --amber-soft:rgba(240,160,48,.14); --on-amber:#1a1204;
  --teal:#34c99a; --teal-soft:rgba(52,201,154,.14); --red:#ff7a72; --red-soft:rgba(255,122,114,.13);
  --blue:#7fb2ff; --blue-soft:rgba(127,178,255,.13); --violet:#b9a2ff; --violet-soft:rgba(185,162,255,.14);
  --input:#111218; --mark:rgba(240,160,48,.28);
}
html[data-theme="light"]{
  --bg:#f5f0e6; --card:#fffdf9; --card-2:#faf6ee; --line:#e7dfd0; --line-strong:#d4c9b5;
  --text:#1f1b14; --muted:#5e584d; --faint:#8e8678; --prose:#2b261d;
  --amber:#b06a08; --amber-soft:rgba(217,142,11,.13); --on-amber:#fff;
  --teal:#0a8a60; --teal-soft:rgba(10,138,96,.1); --red:#c43a30; --red-soft:rgba(196,58,48,.09);
  --blue:#2d64c4; --blue-soft:rgba(45,100,196,.1); --violet:#6a4cc9; --violet-soft:rgba(106,76,201,.1);
  --input:#fbf9f4; --mark:rgba(240,170,40,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--muted);font-family:var(--sans);font-size:15.5px;line-height:1.5;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;text-align:left}
a{color:var(--amber)}
svg{width:20px;height:20px;flex:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
#view{max-width:720px;margin:0 auto;padding:18px 16px 90px}

/* topo */
.home-h{display:flex;justify-content:space-between;align-items:flex-start;margin:6px 0 18px}
.brand{font-family:var(--serif);font-weight:500;font-size:34px;color:var(--text);letter-spacing:-.01em}.brand span{color:var(--amber)}
.tag{font-size:13.5px;color:var(--faint)}
.h-acts{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line);flex:none}
.ib.sm{width:32px;height:32px;border:none}.ib.sm svg{width:17px;height:17px}
.ib[disabled]{opacity:.25}
.bar{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.bar-t{flex:1;min-width:0;font-size:13.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ib:first-child{border:none;margin-left:-10px}
.pg-t{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.15;color:var(--text);margin:2px 0 4px;letter-spacing:-.01em}
.pg-d{font-size:13.5px;color:var(--faint);margin-bottom:14px}
.aviso{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:12px;padding:10px 12px;margin-bottom:14px}

/* listas */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px}
.sec-h h2{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.lk{font-size:13.5px;font-weight:600;color:var(--amber)}.lk.mt{display:block;margin-top:18px}
.grp{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.lista>.row,.lista>.row-w{border-top:1px solid var(--line)}.lista>:first-child{border-top:none}
.row-w{display:flex;align-items:center}.row-w .row{flex:1;min-width:0}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;color:var(--text)}
.row>i{color:var(--faint);display:flex}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt b{font-weight:600;font-size:15.5px;line-height:1.3}.rt small{font-size:12.5px;color:var(--faint)}
.clip1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.ico{width:38px;height:38px;border-radius:11px;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.num{font-family:var(--serif);font-size:15px;color:var(--amber);min-width:26px;text-align:center}
.ord{display:flex;padding-left:6px}
.continuar{width:100%;display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:14px 16px;border-radius:16px;background:var(--amber-soft);color:var(--text);margin-bottom:6px}
.continuar small{grid-column:1;font-size:12px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.05em}
.continuar b{grid-column:1;font-family:var(--serif);font-weight:500;font-size:20px}.continuar span{grid-column:1;font-size:13px;color:var(--muted)}
.continuar i{grid-column:2;grid-row:1/4;align-self:center;color:var(--amber);display:flex}
.vazio{border:1px dashed var(--line-strong);border-radius:16px;padding:18px;font-size:14px;line-height:1.55;color:var(--muted)}

/* botões */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--line-strong);font-size:14px;font-weight:600;color:var(--text)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn.ghost{border-style:dashed;color:var(--muted)}
.btn.perigo{color:var(--red);border-color:transparent;margin-right:auto}
.btn.add{margin-top:12px}.btn.mt{margin-top:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.dica{font-size:13.5px;color:var(--faint);line-height:1.5;margin:6px 0}
.tent{font-size:13px;color:var(--muted);margin:2px 0 8px}.tent b{color:var(--teal)}

/* compor anotação */
.compor{border:1px solid var(--line-strong);border-radius:18px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.in{width:100%;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--text);outline:none}
.in:focus{border-color:var(--amber)}
.in.sm{padding:8px 10px;font-size:13.5px}
textarea.in{resize:vertical;line-height:1.5}
.compor textarea{border:none;background:transparent;padding:4px 2px;min-height:70px}
.cp-pe{display:flex;gap:8px;align-items:center}.cp-pe .in{flex:1}

/* anotações */
.notas{display:flex;flex-direction:column;gap:10px}
.nota{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px 14px}
.nota.pisca{animation:pisca 1.6s var(--ease)}@keyframes pisca{0%,40%{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}}
.nota-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}.nota-d{flex:1;font-size:12.5px;color:var(--faint)}
.nota-t{font-weight:600;color:var(--text);margin:4px 0}
.nota .prosa{font-size:15px}
.longo summary{font-size:13px;font-weight:600;color:var(--amber);cursor:pointer;margin:4px 0}
.fonte{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--faint);margin-top:8px;word-break:break-word}.fonte svg{width:15px;height:15px;margin-top:2px}
.tp{flex:none;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tp-li{background:var(--blue-soft);color:var(--blue)}.tp-pesquisei{background:var(--teal-soft);color:var(--teal)}.tp-encontrei{background:var(--teal-soft);color:var(--teal)}
.tp-ia{background:var(--violet-soft);color:var(--violet)}.tp-critica{background:var(--red-soft);color:var(--red)}.tp-nota{background:var(--card-2);color:var(--muted)}.tp-ficha{background:var(--amber-soft);color:var(--amber)}

/* texto da ficha */
.prosa{color:var(--prose);font-size:16.5px;line-height:1.7}
.prosa p{margin:0 0 .8em}.prosa ul,.prosa ol{margin:0 0 .9em 1.3em}.prosa li{margin:.2em 0}
.prosa blockquote{border-left:3px solid var(--amber);padding:2px 0 2px 12px;margin:0 0 .9em;color:var(--muted);font-style:italic}
.prosa mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.prosa strong{color:var(--text)}.prosa code{font-size:.9em;background:var(--card-2);padding:1px 5px;border-radius:5px}
.ficha-t{margin:6px 0 18px}
.sec>summary{list-style:none;display:flex;align-items:baseline;gap:8px;cursor:pointer}.sec>summary::-webkit-details-marker{display:none}
.sec .chev{display:flex;color:var(--faint);transition:transform .2s var(--ease);align-self:center}.sec .chev svg{width:18px;height:18px}
.sec:not([open])>summary .chev{transform:rotate(-90deg)}
.h{flex:1;color:var(--text);font-family:var(--serif);font-weight:500}
.h1{font-size:26px;line-height:1.2;margin:22px 0 10px}
.s1{border-bottom:1px solid var(--line);margin-bottom:8px}
.h2{font-size:20.5px;line-height:1.3;margin:16px 0 6px}
.h3{font-family:var(--sans);font-size:15.5px;font-weight:700;color:var(--text);letter-spacing:.01em;margin:14px 0 4px}
.sumario{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 10px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.sumario p{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sumario a{text-decoration:none;color:var(--text);font-size:14.5px}.sumario .sm2{padding-left:14px;color:var(--muted);font-size:14px}.sumario .sm3{padding-left:28px;color:var(--faint);font-size:13.5px}
.vazio-t{color:var(--faint);font-style:italic}
.rodape{border-top:1px solid var(--line);margin-top:20px;padding-top:12px}
.rd-t{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.anx{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.anx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.anx-img{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card-2)}.anx-img img{width:100%;height:100%;object-fit:cover;display:block}
.anx-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--text)}
.anx-row span{display:flex;flex-direction:column}.anx-row small{color:var(--faint);font-size:12px}

/* folhas */
#sheet{border:none;padding:0;margin:auto auto 0;width:100%;max-width:720px;max-height:92vh;background:var(--card);color:var(--muted);border-radius:22px 22px 0 0}
#sheet.cheia{height:100%;max-height:100%;margin:0 auto;border-radius:0}
#sheet::backdrop{background:rgba(0,0,0,.55)}
.sh{display:flex;flex-direction:column;max-height:inherit;height:100%}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}.sh-h h2{flex:1;font-family:var(--serif);font-weight:500;font-size:21px;color:var(--text)}
.sh-h .ib{border:none}
.sh-b{padding:4px 16px calc(18px + env(safe-area-inset-bottom,0));overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sh-acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:6px}
.lb{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--faint)}
.in.titulo{font-family:var(--serif);font-size:22px;border:none;background:transparent;padding:4px 0}
.in.corpo{min-height:42vh;font-size:15.5px;line-height:1.6}
.in.grande{min-height:150px}
.fmt{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:-4px;background:var(--card);padding:4px 0;z-index:1}
.fmt button{flex:none;padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--text)}
.fmt mark{background:var(--mark);color:inherit;padding:0 2px}
.destino{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}.emo{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center}.emo.on{border-color:var(--amber);background:var(--amber-soft)}
.arq{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);padding:6px 0}.arq span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arq small{color:var(--faint)}
.anexar{align-self:flex-start}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}.menu .row{border-top:1px solid var(--line)}.menu .row:first-child{border-top:none}
.seg{display:flex;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;text-align:center;color:var(--muted)}.seg button.on{background:var(--card-2);color:var(--text)}
.props{display:flex;flex-direction:column;gap:6px}
.prop{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--text)}
.prop input{margin-top:3px;accent-color:var(--amber)}.prop small{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.qlist{list-style:none;display:flex;flex-direction:column}
.qlist li{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--text)}
.qlist span{flex:1;min-width:0}.qlist small{color:var(--faint);font-size:12px}
.nums{display:flex;gap:10px}.nums label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--faint)}

/* questionário */
.qbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.qbar i{display:block;height:100%;background:var(--amber)}
.qtext{font-size:17.5px;color:var(--text);margin:8px 0}
.ops{display:flex;flex-direction:column;gap:8px}
.op{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:15px}
.op b{width:24px;height:24px;border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:12.5px;flex:none}
.op.certa{border-color:var(--teal);background:var(--teal-soft)}.op.errada{border-color:var(--red);background:var(--red-soft)}
.op[disabled]{cursor:default}
.sol{border-left:3px solid var(--line-strong);padding-left:12px}
.ver{font-weight:700;margin-bottom:4px}.ver.ok{color:var(--teal)}.ver.no{color:var(--red)}
.res{text-align:center;padding:30px 0}.res b{display:block;font-family:var(--serif);font-weight:500;font-size:44px;color:var(--text)}.res p{color:var(--faint)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;transition:.25s var(--ease);z-index:99;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){#sheet:not(.cheia){margin:auto;border-radius:22px}}
</style>
</head>
<body>
<main id="view"></main>
<dialog id="sheet"></dialog>
<input type="file" id="impIn" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="text/plain" id="cogApp">
(() => {
'use strict';
/* =====================================================================
   COGNITIO — caderno de estudos
   Caderno → Matéria → Conteúdo → fichas e anotações
   Os dados são os mesmos de antes, só com nomes novos:
     state.fields = cadernos · state.areas = matérias · note.tema = conteúdo
     state.notes  = fichas (kind vazio) e anotações (kind 'anotacao')
     state.decks  = questões de cada ficha (deck.noteId)
   Nada do que existia é apagado: campos antigos (status, revisões,
   pílulas) continuam guardados, só não aparecem mais.
   ===================================================================== */
const TESTE = /cognitio-novo/.test(location.pathname);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '';
const norm = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const LETTERS = ['A', 'B', 'C', 'D', 'E'];
const agora = () => new Date().toISOString();
const dataCurta = iso => { const d = new Date(iso), h = new Date(); const dias = Math.round((new Date(h.toDateString()) - new Date(d.toDateString())) / 864e5);
  return dias === 0 ? 'hoje' : dias === 1 ? 'ontem' : dias < 7 ? `há ${dias} dias` : d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', ...(d.getFullYear() !== h.getFullYear() ? { year: 'numeric' } : {}) }).replace('.', ''); };
const dataLonga = iso => new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const plainText = t => String(t || '').replace(/==|\*\*|[#>*`]/g, '').replace(/^\s*[-•]\s/gm, '').replace(/\s+/g, ' ').trim();
const ROMANOS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX'];
const romano = i => ROMANOS[i] || String(i + 1);

const IC = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

/* ============ Texto da ficha: títulos, seções recolhíveis e sumário ============ */
function inline(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>').replace(/==([^=]+)==/g, '<mark>$1</mark>')
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function prosa(text) {
  const lines = esc(text).split('\n'); let html = '', lista = '', para = [];
  const flush = () => { if (para.length) { html += `<p>${inline(para.join('<br>'))}</p>`; para = []; } };
  const fecha = () => { if (lista) { html += `</${lista}>`; lista = ''; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { flush(); fecha(); continue; }
    let m;
    if ((m = l.match(/^[-•*]\s+(.*)/))) { flush(); if (lista !== 'ul') { fecha(); html += '<ul>'; lista = 'ul'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\d+[.)]\s+(.*)/))) { flush(); if (lista !== 'ol') { fecha(); html += '<ol>'; lista = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else if (/^&gt;\s?/.test(l)) { flush(); fecha(); html += `<blockquote>${inline(l.replace(/^&gt;\s?/, ''))}</blockquote>`; }
    else { fecha(); para.push(l); }
  }
  flush(); fecha(); return html;
}
function blocosDe(text) {
  const out = []; let buf = [];
  const solta = () => { if (buf.length) { out.push({ html: prosa(buf.join('\n')) }); buf = []; } };
  String(text || '').replace(/\r/g, '').split('\n').forEach(l => {
    const m = l.match(/^(#{1,3})\s+(.+)$/);
    if (m) { solta(); out.push({ h: m[1].length, t: m[2].trim() }); } else buf.push(l);
  });
  solta(); return out;
}
function textoDaFicha(n) {
  const bl = blocosDe(n.body); let k = 0;
  const titulos = bl.filter(b => b.h).map(b => ({ h: b.h, t: b.t, id: 'sec-' + (k++) }));
  k = 0;
  function build(i, nivel) {
    let out = '';
    while (i < bl.length) {
      const b = bl[i];
      if (b.h) {
        if (b.h <= nivel) break;
        const id = 'sec-' + (k++), tag = `<span class="h h${b.h}">${inline(esc(b.t))}</span>`;
        if (b.h <= 2) {
          const [dentro, j] = build(i + 1, b.h);
          out += `<details class="sec s${b.h}" id="${id}" open><summary>${tag}<i class="chev">${IC.down}</i></summary><div class="sec-b">${dentro}</div></details>`;
          i = j; continue;
        }
        out += `<h4 class="h3" id="${id}">${inline(esc(b.t))}</h4>`; i++; continue;
      }
      out += b.html; i++;
    }
    return [out, i];
  }
  return { html: build(0, 0)[0], titulos };
}

/* ============ Questões: leitura de texto colado (formato de IA e de prova) ============ */
const RX_OPT = /^\(?([A-Ea-e])\s*[\)\.\-–:]\s+(.+)$/;
const RX_KEY = /^(gabarito|resposta correta|resposta|correta|alternativa correta)\s*[:\-–]\s*(.*)$/i;
const RX_EXP = /^(coment[aá]rio|explica[cç][aã]o|justificativa|solu[cç][aã]o)\s*[:\-–]\s*(.*)$/i;
function parseBlock(text) {
  // a IA às vezes devolve markdown: negrito, títulos, listas ("* ", "- ", "• "), citações e recuos
  text = String(text || '').replace(/\r/g, '').replace(/\*\*|__/g, '').replace(/^\s*#{1,6}\s+/gm, '')
    .replace(/^[ \t]*(?:[*\-•+][ \t]+|>[ \t]?)+/gm, '').replace(/^[ \t]+/gm, '')
    .replace(/^(quest[aã]o\s*\d+)\s*[:\-–.]?\s*$/gim, '')                       // linha só com "Questão 3"
    .replace(/^(?:parte\s+\w+\s*[:\-–]?\s*)?(?:quest[oõ]es|perguntas)?\s*(?:objetivas|dissertativas|abertas|discursivas|de m[uú]ltipla escolha)\s*:?\s*$/gim, '')   // títulos de seção
    .replace(/^(?:aqui est[aã]o|segue[m]?|claro|com certeza|abaixo)\b[^\n]*$/gim, '');  // frase de abertura da IA
  // "Gabarito: B) texto" ou "Resposta correta: letra B" continuam valendo
  const items = [], warns = []; let cur = null;
  const start = () => { cur = { q: [], opts: [], key: null, exp: [], ans: [], last: null, gap: false }; };
  const finish = () => {
    if (!cur) return;
    const q = cur.q.join('\n').replace(/^\s*(quest[aã]o\s*)?\d+\s*[\.\)\-–:]\s*/i, '').trim(), n = items.length + 1;
    if (!q && !cur.opts.length && !cur.key) { cur = null; return; }
    if (cur.opts.length >= 2) {
      const kk = (cur.key || '').trim(), m = kk.match(/^\(?([A-Ea-e])(?![a-zà-ú])\)?/);
      const correct = m ? m[1].toUpperCase() : '';
      const rest = m ? kk.slice(m[0].length).replace(/^[\s.\-–:,]+/, '') : kk;
      if (!correct) warns.push(`Questão ${n}: sem gabarito (A a E). Você vai avaliar-se sozinho.`);
      else if (!cur.opts.some(o => o.k === correct)) warns.push(`Questão ${n}: gabarito ${correct} não corresponde a nenhuma alternativa.`);
      items.push({ type: 'mc', text: q || `Questão ${n}`, options: cur.opts, correct, explanation: [rest, ...cur.exp].filter(Boolean).join('\n').trim() });
    } else {
      let t = q, ans = [cur.key || '', ...cur.ans, ...cur.exp].filter(Boolean).join('\n').trim();
      if (cur.opts.length === 1) { warns.push(`Questão ${n}: só uma alternativa encontrada; entrou como dissertativa.`); t += '\n' + cur.opts[0].k + ') ' + cur.opts[0].t; }
      items.push({ type: 'open', text: t, answer: ans });
    }
    cur = null;
  };
  const linhas = text.replace(/\r/g, '').split('\n');
  // começo de questão mesmo sem linha em branco (o app do Gemini apaga as linhas vazias ao copiar):
  // termina em "?" ou ":", vem numerada, ou a próxima linha já é uma alternativa ou "Resposta:"
  const abre = idx => {
    const l = linhas[idx].trim();
    if (/^(quest[aã]o\s*)?\d+\s*[\.\)\-–:]\s+\S/i.test(l) || /[?:]$/.test(l)) return true;
    for (let j = idx + 1; j < linhas.length; j++) { const n = linhas[j].trim(); if (!n) continue; return RX_OPT.test(n) || /^(resposta|gabarito)\s*[:\-–]/i.test(n); }
    return false;
  };
  for (let li = 0; li < linhas.length; li++) {
    const raw = linhas[li], l = raw.trim();
    if (!l) { if (cur) { if (['key', 'exp', 'ans'].includes(cur.last)) finish(); else cur.gap = true; } continue; }
    let m;
    if ((m = l.match(RX_KEY))) { if (!cur) start(); cur.key = m[2]; cur.last = 'key'; cur.gap = false; continue; }
    if ((m = l.match(RX_EXP))) { if (!cur) start(); cur.exp.push(m[2]); cur.last = 'exp'; cur.gap = false; continue; }
    if ((m = l.match(RX_OPT)) && cur && cur.q.length) {
      if (['key', 'exp', 'ans'].includes(cur.last)) { finish(); start(); }
      cur.opts.push({ k: m[1].toUpperCase(), t: m[2].trim() }); cur.last = 'opt'; cur.gap = false; continue;
    }
    if (l.includes('::') && (!cur || !cur.opts.length)) {
      finish(); const [a, ...b] = l.split('::');
      if (a.trim()) items.push({ type: 'open', text: a.trim(), answer: b.join('::').trim() });
      continue;
    }
    if (cur && (cur.gap || (cur.last === 'key' && cur.opts.length) || (['key', 'exp', 'ans'].includes(cur.last) && abre(li)))) { finish(); }
    if (cur && cur.last === 'opt') { cur.opts[cur.opts.length - 1].t += ' ' + l; continue; }
    if (cur && cur.last === 'key') { cur.ans.push(l); cur.last = 'ans'; continue; }
    if (cur && (cur.last === 'exp' || cur.last === 'ans')) { (cur.last === 'exp' ? cur.exp : cur.ans).push(l); continue; }
    if (!cur) start();
    cur.q.push(l); cur.last = 'q'; cur.gap = false;
  }
  finish();
  return { items, warns };
}


const genStrip = t => String(t || '').replace(/==([^=]+)==/g, '$1').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1').replace(/\s+/g, ' ').trim();

const RX_QSEC = /^(quest[oõ]es|exerc[ií]cios|simulado|perguntas|teste|quiz)\b/i;

function materiaDe(note) {

  const fechaBloco = () => { if (bloco.length) { escritas.push(...parseBlock(bloco.join('\n')).items); bloco = []; } };

    hs.forEach((h, i) => {

      if (frase.length >= 12) lacunas.push({ frase, resp: genStrip(h[1]), linha: genStrip(corpo), ctx });

/* embaralha de forma estável (a mesma pergunta sempre com a mesma ordem) */
function genMistura(arr, semente) {
  let h = 0; for (const c of semente) h = (h * 31 + c.charCodeAt(0)) | 0;
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { h = (h * 1103515245 + 12345) | 0; const j = Math.abs(h) % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function genObjetiva(texto, certa, erradas, semente, explicacao, perto = []) {
  // alternativas erradas: primeiro as do mesmo tema (mais difíceis), depois o resto da área
  const ok = x => norm(x) !== norm(certa);
  const prox = genMistura([...new Set(perto.filter(ok))], semente + '#p');
  const dist = [...new Set([...prox, ...genMistura([...new Set(erradas.filter(ok))], semente + '#d')])].slice(0, 3);
  if (dist.length < 3) return null;
  const corte = t => t.length > 150 ? t.slice(0, 148).trim() + '…' : t;
  const ops = genMistura([certa, ...dist], semente).map((t, i) => ({ k: LETTERS[i], t: corte(t) }));
  return { type: 'mc', text: texto, options: ops, correct: LETTERS[ops.findIndex(o => o.t === corte(certa))], explanation: explicacao || '' };
}
function propostasDe(notes, formato, pool) {
  const out = [], vistos = new Set();
  const add = (q, note, tipo) => {
    if (!q) return;
    const key = note.id + '|' + q.type + '|' + genStrip(q.text).toLowerCase();
    if (vistos.has(key)) return; vistos.add(key);
    out.push({ ...q, key, tipo, noteId: note.id });
  };
  const defsPool = pool.termos.map(t => t.def), termosPool = pool.termos.map(t => t.termo), respPool = [...pool.lacunas.map(l => l.resp), ...termosPool];
  notes.forEach(note => {
    const M = materiaDe(note), ctxTxt = c => c ? ` (${c})` : '';
    M.escritas.forEach(q => add(q, note, 'escrita'));
    M.termos.forEach((t, i) => {
      if (formato !== 'mc') add({ type: 'open', text: `Explique: “${t.termo}”.${t.ctx && norm(t.ctx) !== norm(t.termo) ? ctxTxt(t.ctx) : ''}`, answer: `**${t.termo}:** ${t.def}${t.ctx ? `\n\n*${t.ctx}*` : ''}` }, note, 'termo');
      if (formato !== 'open') {
        const expl = `${t.termo}: ${t.def}`;
        const q = i % 2 === 0
          ? genObjetiva(`Qual alternativa corresponde a “${t.termo}”?${ctxTxt(t.ctx)}`, t.def, defsPool, note.id + t.termo, expl, pool.termos.filter(x => x.ctx === t.ctx).map(x => x.def))
          : genObjetiva(`A qual termo se refere: “${t.def.length > 160 ? t.def.slice(0, 158) + '…' : t.def}”?`, t.termo, termosPool, note.id + t.termo, expl, pool.termos.filter(x => x.ctx === t.ctx).map(x => x.termo));
        add(q, note, 'termo');
      }
    });
    M.lacunas.forEach(l => {
      if (formato !== 'mc') add({ type: 'open', text: `Complete: ${l.frase}${ctxTxt(l.ctx)}`, answer: `**${l.resp}**\n\n${l.linha}` }, note, 'lacuna');
      if (formato !== 'open') add(genObjetiva(`Complete: ${l.frase}${ctxTxt(l.ctx)}`, l.resp, respPool, note.id + l.frase, l.linha), note, 'lacuna');
    });
  });
  return out;
}
function pedidoIA(notes, nObj, nDis) {
  const texto = notes.map(n => `# ${n.title}\n${n.body || ''}`).join('\n\n').slice(0, 24000);
  return `Crie questões de estudo a partir do texto abaixo, para revisar para uma prova de graduação.

Faça ${nObj} questões objetivas e ${nDis} dissertativas, cobrindo os conceitos mais importantes, com alternativas erradas plausíveis.

Use EXATAMENTE este formato, sem markdown, sem negrito e sem títulos. Numere cada questão (1., 2., 3.…) e separe cada uma com uma linha em branco:

1. Enunciado da questão objetiva?
A) alternativa
B) alternativa
C) alternativa
D) alternativa
Gabarito: B
Comentário: por que a B é a correta.

2. Enunciado da questão dissertativa?
Resposta: a resposta modelo, com os pontos que não podem faltar.

TEXTO:
${texto}`;
}

function pedidoIA(notes, nObj, nDis) {
  // linhas inteiras entre colchetes são observações suas e não vão para a IA
  const limpa = t => String(t || '').split('\n').filter(l => !/^\s*\[[^\]]*\]\s*$/.test(l)).join('\n');
  const texto = notes.map(n => `# ${n.title}\n${limpa(n.body)}`).join('\n\n').slice(0, 24000);
  const ex = [];
  if (nObj > 0) ex.push(`1. Enunciado da questão objetiva?\nA) alternativa\nB) alternativa\nC) alternativa\nD) alternativa\nGabarito: B\nComentário: por que a B é a correta.`);
  if (nDis > 0) ex.push(`${ex.length + 1}. Enunciado da questão dissertativa?\nResposta: a resposta modelo, com os pontos que não podem faltar.`);
  const pede = [nObj > 0 ? plural(nObj, 'questão objetiva', 'questões objetivas') : '', nDis > 0 ? plural(nDis, 'questão dissertativa', 'questões dissertativas') : ''].filter(Boolean).join(' e ');
  return `Crie questões de estudo a partir do texto abaixo, para revisar para uma prova de graduação.

Faça exatamente ${pede}, cobrindo os conceitos mais importantes${nObj > 0 ? ', com alternativas erradas plausíveis' : ''}.

Use EXATAMENTE este formato, sem markdown, sem negrito e sem títulos. Numere cada questão (1., 2., 3.…) e separe cada uma com uma linha em branco:

${ex.join('\n\n')}

TEXTO:
${texto}`;
}
function pedidoOrganizar(materia, tema, lista) {
  const ordem = lista.slice().sort((a, b) => Date.parse(a.createdAt) - Date.parse(b.createdAt));
  const linhas = ordem.map((n, i) => {
    const cab = ehAnotacao(n) ? `[${i + 1}] ${tipoNome(n.tipo)} · ${dataLonga(n.createdAt)}${n.refs[0] ? ' · fonte: ' + n.refs[0] : ''}` : `[${i + 1}] Ficha: ${n.title}`;
    return `${cab}\n${(n.title && ehAnotacao(n) && n.tipo === 'ia' ? 'Resumo: ' + n.title + '\n' : '')}${n.body}`;
  }).join('\n\n').slice(0, 30000);
  return `Organize as minhas anotações de estudo abaixo numa ficha-resumo clara, em português.

Matéria: ${materia}
Conteúdo: ${tema || 'Geral'}

Regras:
- Use títulos com # e ## (markdown simples), listas com "- " e **negrito** só nos termos-chave, no formato "- **Termo:** definição".
- Agrupe por ideia, não pela ordem das anotações. Não invente nada que não esteja nas anotações.
- Coloque as minhas críticas e opiniões numa seção final "# Minhas críticas", com as minhas palavras.
- Ao fim de cada parágrafo ou item, indique entre colchetes de qual anotação veio, por exemplo [3].
- Termine com "# Fontes", listando as fontes citadas.

ANOTAÇÕES:
${linhas}`;
}

/* ============ Resumo para os outros apps (contrato lembre-se) ============ */
function construirResumoCognitio() {
  const clip = (t, n) => { t = String(t || ''); return t.length > n ? t.slice(0, n - 1).trim() + '…' : t; };
  const num = v => Number.isFinite(+v) ? +v : 0;
  return {
    exportedAt: null,
    fields: state.fields.map(f => ({ id: f.id, title: f.title, icon: f.icon || '📚', posture: f.posture || 'ultra' })),
    areas: state.areas.map(a => ({ id: a.id, fieldId: a.fieldId, title: a.title, status: [0, 1, 2].includes(+a.status) ? +a.status : 0, ...(a.simulados ? { simulados: true } : {}) })),
    notes: state.notes.map(n => ({ id: n.id, areaId: n.areaId, title: clip(n.title, 120), tags: Array.isArray(n.tags) ? n.tags.slice(0, 8) : [], createdAt: n.createdAt, ...(n.tema ? { tema: n.tema } : {}), ...(n.kind === 'simulado' ? { kind: 'simulado' } : {}) })),
    decks: state.decks.map(k => ({ id: k.id, title: k.title, fieldId: k.fieldId, areaId: k.areaId || null, noteId: k.noteId || null,
      items: k.items.map(i => ({ id: i.id, last: i.lastAt || null, t: clip(i.text, 160), due: i.due || null, g: typeof i.lastGrade === 'number' ? i.lastGrade : -1, seen: !!i.seen, done: !!i.done })) })),
    pillLog: state.pillLog.slice(-500).map(l => ({ deckId: l.deckId, t: clip(l.text, 120), minutes: num(l.minutes), grade: l.grade, at: l.at })),
    pillOfDay: state.pillOfDay || null
  };
}
function publicarResumo() {
  if (!window.Lembre) return;
  if (!publicarResumo.agendado) publicarResumo.agendado = Lembre.agendar('cognitio', construirResumoCognitio, 900);
  publicarResumo.agendado();
}

let route = { v: 'home' };
function lerRota() {
  const p = new URLSearchParams(location.search);
  if (p.get('ficha')) { const n = notaById(p.get('ficha')); if (n) return ehAnotacao(n) ? { v: 'conteudo', aid: n.areaId, tema: n.tema, foco: n.id } : { v: 'ficha', id: n.id }; }
  const aid = p.get('m') || p.get('area');
  if (aid && materiaById(aid)) return p.has('t') ? { v: 'conteudo', aid, tema: p.get('t') } : { v: 'materia', aid };
  if (p.get('c') && cadernoById(p.get('c'))) return { v: 'caderno', id: p.get('c') };
  return { v: 'home' };
}
function urlDe(r) {
  const u = new URL(location.href); ['c', 'm', 't', 'area', 'ficha', 'compartilhar', 'title', 'text', 'url'].forEach(k => u.searchParams.delete(k));
  if (r.v === 'caderno') u.searchParams.set('c', r.id);
  if (r.v === 'materia') u.searchParams.set('m', r.aid);
  if (r.v === 'conteudo') { u.searchParams.set('m', r.aid); u.searchParams.set('t', r.tema); }
  if (r.v === 'ficha') u.searchParams.set('ficha', r.id);
  return u.pathname + u.search;
}
function go(r, substituir) {
  route = r; organizando = false;
  history[substituir ? 'replaceState' : 'pushState']({ r }, '', urlDe(r));
  render(); scrollTo(0, 0);
}
addEventListener('popstate', e => { route = (e.state && e.state.r) || lerRota(); organizando = false; render(); });
function voltar() {
  const r = route;
  if (r.v === 'ficha') { const n = notaById(r.id); return go(n ? { v: 'conteudo', aid: n.areaId, tema: n.tema } : { v: 'home' }); }
  if (r.v === 'conteudo') return go({ v: 'materia', aid: r.aid });
  if (r.v === 'materia') { const a = materiaById(r.aid); return go(a ? { v: 'caderno', id: a.fieldId } : { v: 'home' }); }
  go({ v: 'home' });
}

async function copiar(texto) {

}

function aplicarFmt(tipo) {
  const ta = $('#eBody'), s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel = v.slice(s, e);
  const ini = v.lastIndexOf('\n', s - 1) + 1;
  const linha = pre => { const l = v.slice(ini).replace(/^(#{1,3}\s|[-•]\s)/, ''); ta.value = v.slice(0, ini) + pre + l; ta.setSelectionRange(ini + pre.length, ini + pre.length); };
  const envolve = (a, b, ph) => { const t = sel || ph; ta.value = v.slice(0, s) + a + t + b + v.slice(e); ta.setSelectionRange(s + a.length, s + a.length + t.length); };
  ({ h1: () => linha('# '), h2: () => linha('## '), h3: () => linha('### '), ul: () => linha('- '),
    b: () => envolve('**', '**', 'negrito'), i: () => envolve('*', '*', 'itálico'), mark: () => envolve('==', '==', 'destaque'),
    termo: () => { ta.value = v.slice(0, ini) + '- **' + (sel || 'Termo') + ':** ' + v.slice(e).replace(/^\s*/, ''); ta.setSelectionRange(ini + 4, ini + 4 + (sel || 'Termo').length); } }[tipo])();
  ta.focus();
}
async function salvarFicha() {
  const title = $('#eTit').value.trim(), body = $('#eBody').value, { aid, tema } = lerDestino();
  if (!aid) return toast('Crie uma matéria antes.');
  if (!title && !body.trim()) return toast('Escreva um título ou um texto.');
  const refs = $('#eRefs').value.split('\n').map(x => x.trim()).filter(Boolean);
  try { for (const x of rascunho.novos) if (rascunho.files.includes(x.meta)) await blobPut(x.meta.id, x.file); }
  catch (e) { return toast('Não foi possível guardar um anexo neste aparelho.'); }
  let n = rascunho.id && notaById(rascunho.id);
  if (n) {
    const removidos = n.files.filter(f => f.id && !rascunho.files.some(g => g.id === f.id)).map(f => f.id);
    Object.assign(n, { title, body, refs, files: rascunho.files, areaId: aid, tema, updatedAt: agora() }); blobDel(removidos);
  } else {
    n = { id: uid(), areaId: aid, tema, title, body, tags: [], refs, files: rascunho.files, cover: '', createdAt: agora() };
    state.notes.push(n);
  }
  const k = deckDe(n); if (k) { k.title = n.title; k.areaId = aid; k.fieldId = materiaById(aid).fieldId; }
  persist(); fecharFolha(); go({ v: 'ficha', id: n.id }, !!rascunho.id); toast('Ficha guardada');
}
function apagarNota(id) {
  const n = notaById(id); if (!n) return;
  blobDel(n.files.filter(f => f.id).map(f => f.id));
  state.notes = state.notes.filter(x => x !== n);
  state.decks = state.decks.filter(k => k.noteId !== id);
  persist();
}

function folhaReflexao(id) {
  abrirFolha('Reflexão', `<p class="dica">Entra no fim desta ficha, na seção “Reflexões”, com a data de hoje.</p>
    <textarea class="in grande" id="rTexto" rows="6" placeholder="O que isso te fez pensar? Concorda? Onde já viu isso?"></textarea>
    <div class="sh-acts"><button class="btn pri" data-salvar-reflexao="${id}">Guardar</button></div>`);
  setTimeout(() => $('#rTexto')?.focus(), 50);

function juntarReflexao(body, texto) {
  const linhas = body.replace(/\r/g, '').split('\n'), entrada = `*${dataLonga(agora())}* — ${texto.trim()}`;
  const i = linhas.findIndex(l => /^#\s+reflex[oõ]es\s*$/i.test(l.trim()));
  if (i < 0) return body.replace(/\s+$/, '') + `\n\n# Reflexões\n${entrada}\n`;
  let j = linhas.findIndex((l, k) => k > i && /^#\s/.test(l)); if (j < 0) j = linhas.length;
  while (j > i + 1 && !linhas[j - 1].trim()) j--;
  linhas.splice(j, 0, '', entrada);
  return linhas.join('\n');
}

/* ---------- questões de uma ficha ---------- */
function deckCriar(n) {
  let k = deckDe(n); if (k) return k;
  const a = materiaById(n.areaId);
  k = { id: uid(), title: n.title, unit: 'questões', fieldId: a.fieldId, areaId: a.id, source: '', order: 'seq', principle: 'retrieval', items: [], createdAt: agora(), noteId: n.id };
  state.decks.push(k); return k;
}
function novoItem(q) {
  return { id: uid(), type: q.type, text: q.text, answer: q.answer || '', options: q.options || [], correct: q.correct || '', explanation: q.explanation || '', done: false, minutes: 0, seen: false, ease: 2.5, interval: 0, reps: 0, lapses: 0, lastGrade: -1, due: null, ...(q.key ? { key: q.key } : {}), ...(q.noteId ? { noteId: q.noteId } : {}) };
}
function adicionarQuestoes(n, lista) {
  const k = deckCriar(n), tem = new Set(k.items.map(i => norm(i.text)));
  let c = 0; lista.forEach(q => { if (!tem.has(norm(q.text))) { k.items.push(novoItem(q)); tem.add(norm(q.text)); c++; } });
  persist(); return c;
}
let qAba = 'lista', qFormato = 'ambas', qLido = null;
function folhaQuestoes(id, aba) {
  const n = notaById(id); if (!n) return;
  qAba = aba || (questoesDe(n).length ? 'lista' : 'gerar');
  const qs = questoesDe(n);

  if (qAba === 'lista') corpo = qs.length ? `<ol class="qlist">${qs.map(i => `<li><span>${esc(i.text.split('\n')[0])}</span><small>${i.type === 'mc' ? 'objetiva' : 'dissertativa'}</small><button class="ib sm" data-tirar-q="${i.id}" aria-label="Excluir questão">${IC.x}</button></li>`).join('')}</ol>` : '<p class="dica">Nenhuma questão ainda.</p>';
  if (qAba === 'gerar') {
    const pool = materiaDe(n), props = propostasDe([n], qFormato === 'ambas' ? 'ambas' : qFormato, pool).filter(p => !qs.some(i => norm(i.text) === norm(p.text)));
    corpo = `<div class="seg">${[['ambas', 'Ambas'], ['mc', 'Objetivas'], ['open', 'Dissertativas']].map(([k, t]) => `<button type="button" class="${qFormato === k ? 'on' : ''}" data-qformato="${k}">${t}</button>`).join('')}</div>
      ${props.length ? `<p class="dica">${plural(props.length, 'questão saiu', 'questões saíram')} dos termos em negrito (“**Termo:** definição”), dos ==destaques== e das questões escritas na ficha.</p>
        <div class="props">${props.map((p, i) => `<label class="prop"><input type="checkbox" data-prop="${i}" checked><span>${esc(p.text)}<small>${p.type === 'mc' ? 'objetiva · gabarito ' + esc(p.correct) : 'dissertativa'}</small></span></label>`).join('')}</div>
        <div class="sh-acts"><button class="btn pri" data-add-props="${n.id}">Adicionar marcadas</button></div>`
        : `<p class="dica">Não encontrei nada para transformar em questão. Escreva termos como “- **Termo:** definição”, marque ==destaques==, ou peça para uma IA na aba ao lado.</p>`}`;
    qLido = props;
  }
  if (qAba === 'ia') corpo = `<p class="dica">Copie o pedido, cole no Gemini ou outra IA, e cole a resposta aqui embaixo.</p>
    <div class="nums"><label>Objetivas<input class="in sm" type="number" id="iaObj" min="0" max="30" value="8"></label><label>Dissertativas<input class="in sm" type="number" id="iaDis" min="0" max="30" value="2"></label></div>
    <button class="btn" data-copiar-pedido="${n.id}">Copiar pedido</button>
    <textarea class="in grande" id="iaResp" rows="8" placeholder="Cole aqui a resposta da IA"></textarea>
    <p class="dica" id="iaLido"></p>
    <div class="sh-acts"><button class="btn pri" data-add-ia="${n.id}">Adicionar questões</button></div>`;
  abrirFolha('Questões · ' + (n.title || 'ficha'), `<div class="seg abas">${[['lista', 'Lista' + (qs.length ? ' · ' + qs.length : '')], ['gerar', 'Gerar do texto'], ['ia', 'Pedir para IA']].map(([k, t]) => `<button type="button" class="${qAba === k ? 'on' : ''}" data-qaba="${k}" data-nid="${n.id}">${t}</button>`).join('')}</div>${corpo}`, true);

/* ---------- responder ---------- */
let quiz = null;
function questoesDoAlvo(alvo) {
  const [tipo, resto] = alvo.split(':');
  let notas = [];
  if (tipo === 'note') notas = [notaById(resto)].filter(Boolean);
  if (tipo === 'tema') { const [aid, ...t] = resto.split('|'); notas = itensDoConteudo(aid, t.join('|')); }
  if (tipo === 'area') notas = itensDe(resto);
  return notas.flatMap(n => { const k = deckDe(n); return k ? k.items.map(i => ({ k, i })) : []; });
}
function iniciarQuiz(alvo, soEstas) {
  let lista = questoesDoAlvo(alvo);
  if (soEstas) lista = lista.filter(x => soEstas.includes(x.i.id));
  if (!lista.length) return toast('Sem questões aqui ainda.');
  if (!alvo.startsWith('note:')) lista = lista.sort(() => Math.random() - .5);
  quiz = { alvo, lista, pos: 0, acertos: 0, erradas: [], resp: null };
  abrirFolha('', '', true); dlg().classList.add('quiz'); desenharQuiz();
}
function desenharQuiz() {
  const Q = quiz, b = $('.sh-b', dlg()), h = $('.sh-h h2', dlg());
  if (Q.pos >= Q.lista.length) return fimQuiz();
  const { i } = Q.lista[Q.pos];
  h.textContent = `${Q.pos + 1} de ${Q.lista.length}`;
  const resp = Q.resp;
  b.innerHTML = `<div class="qbar"><i style="width:${Q.pos / Q.lista.length * 100}%"></i></div>
    <div class="qtext prosa">${prosa(i.text)}</div>
    ${i.type === 'mc' ? `<div class="ops">${i.options.map(o => {
      let c = ''; if (resp) { if (o.k === i.correct) c = ' certa'; else if (o.k === resp.esc) c = ' errada'; }
      return `<button class="op${c}" data-op="${o.k}" ${resp ? 'disabled' : ''}><b>${o.k}</b><span>${esc(o.t)}</span></button>`;
    }).join('')}</div>`
    : `<textarea class="in" id="qMinha" rows="4" placeholder="Responda com as suas palavras (opcional)" ${resp ? 'readonly' : ''}>${esc(resp ? resp.minha : '')}</textarea>`}
    ${resp ? `<div class="sol">${i.type === 'mc' ? `<p class="ver ${resp.ok ? 'ok' : 'no'}">${resp.ok ? 'Certo' : 'Errado · correta: ' + esc(i.correct)}</p>` : ''}${(i.type === 'open' ? i.answer : i.explanation) ? `<div class="prosa">${prosa(i.type === 'open' ? i.answer : i.explanation)}</div>` : ''}</div>` : ''}
    <div class="sh-acts">${!resp ? (i.type === 'open' ? `<button class="btn pri" data-ver-resp>Ver resposta</button>` : '') :
      i.type === 'open' && resp.ok === undefined ? `<button class="btn" data-auto="0">Errei</button><button class="btn pri" data-auto="1">Acertei</button>` : `<button class="btn pri" data-prox>Próxima</button>`}</div>`;
}
function registrar(ok) {
  const { i } = quiz.lista[quiz.pos];
  quiz.resp.ok = ok; if (ok) quiz.acertos++; else quiz.erradas.push(i.id);
  i.seen = true; i.lastAt = agora(); i.lastGrade = ok ? 2 : 0;
}
function fimQuiz() {
  const Q = quiz, t = { id: uid(), alvo: Q.alvo, at: agora(), acertos: Q.acertos, total: Q.lista.length, erradas: Q.erradas };
  const ant = state.tentativas.filter(x => x.alvo === Q.alvo).pop();
  state.tentativas.push(t); if (state.tentativas.length > 2000) state.tentativas = state.tentativas.slice(-2000);
  persist();
  $('.sh-h h2', dlg()).textContent = 'Resultado';
  $('.sh-b', dlg()).innerHTML = `<div class="res"><b>${t.acertos} de ${t.total}</b><p>${ant ? `Antes: ${ant.acertos} de ${ant.total} (${dataCurta(ant.at)})` : 'Primeira vez com estas questões.'}</p></div>
    <div class="sh-acts">${Q.erradas.length ? `<button class="btn" data-refazer>Refazer as ${Q.erradas.length} que errei</button>` : ''}<button class="btn pri" data-fechar>Fechar</button></div>`;
  render();
}

function buscar(q) {
  const t = norm(q.trim()); const el = $('#bRes'); if (!el) return;
  if (t.length < 2) { el.innerHTML = ''; return; }
  const res = state.notes.filter(n => norm(n.title + ' ' + n.body + ' ' + n.tema + ' ' + n.refs.join(' ')).includes(t)).sort((a, b) => quando(b).localeCompare(quando(a))).slice(0, 40);
  el.innerHTML = res.length ? res.map(itemLinha).join('') : '<p class="dica">Nada encontrado.</p>';

function baixar(nome, conteudo, tipo) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo })); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
}
const hojeArq = () => new Date().toISOString().slice(0, 10);
function exportarCaderno(fid) {
  const f = cadernoById(fid); let md = `# ${f.title}\n${f.description ? '\n' + f.description + '\n' : ''}`;
  materiasDe(fid).forEach(a => {
    md += `\n\n## ${a.title}${a.semestre ? ' (' + a.semestre + ')' : ''}\n`;
    [...conteudosDe(a), ''].forEach(t => {
      const its = itensDoConteudo(a.id, t).sort((x, y) => Date.parse(x.createdAt) - Date.parse(y.createdAt)); if (!its.length) return;
      md += `\n### ${t || 'Geral'}\n`;
      its.forEach(n => {
        if (ehAnotacao(n)) md += `\n- **${tipoNome(n.tipo)} · ${dataLonga(n.createdAt)}**${n.title ? ' — ' + n.title : ''}\n${n.body.split('\n').map(l => '  ' + l).join('\n')}${n.refs.length ? '\n  Fonte: ' + n.refs.join(' · ') : ''}\n`;
        else md += `\n#### ${n.title || 'Sem título'}\n\n${n.body.replace(/^(#{1,3})\s/gm, (m, h) => '#'.repeat(Math.min(6, h.length + 4)) + ' ')}\n${n.refs.length ? '\nFontes: ' + n.refs.join(' · ') + '\n' : ''}`;
      });
    });
  });
  baixar(`${f.title.replace(/[^\wÀ-ú -]/g, '').trim() || 'caderno'} ${hojeArq()}.md`, md, 'text/markdown');
}

  if (e.target.id === 'iaResp') { const { items } = parseBlock(e.target.value); const l = $('#iaLido'); if (l) l.textContent = items.length ? `${plural(items.length, 'questão encontrada', 'questões encontradas')}` : ''; }
  if (e.target.id === 'dMat') { const a = materiaById(e.target.value); const dl = $('#dTemaL'); if (a && dl) dl.innerHTML = conteudosDe(a).map(t => `<option value="${esc(t)}">`).join(''); }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'dMat') { const a = materiaById(e.target.value); const dl = $('#dTemaL'); if (a && dl) dl.innerHTML = conteudosDe(a).map(t => `<option value="${esc(t)}">`).join(''); $('#dTema').value = ''; }
  if (e.target.id === 'eFileIn') {
    for (const file of e.target.files) {
      if (file.size > MAX_FILE) { toast(`${file.name} passa de 100 MB.`); continue; }
      const meta = { id: uid(), name: file.name, type: file.type || '', size: file.size, addedAt: agora() };
      rascunho.files.push(meta); rascunho.novos.push({ meta, file });
    }
    e.target.value = ''; desenharArquivos();
  }
  if (e.target.id === 'impIn') {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); if (!isValid(d)) throw new Error('inválido');
      if (!confirm(`Substituir tudo pelos dados do backup (${plural(d.notes.length, 'item', 'itens')})?`)) return;
      state = normalize(d); persist(); fecharFolha(); go({ v: 'home' }, true); toast('Backup importado');
    } catch (x) { toast('Este arquivo não é um backup do Cognitio.'); }
  }
});
dlg().addEventListener('close', () => { if (dlg().classList.contains('quiz')) quiz = null; dlg().innerHTML = ''; });
dlg().addEventListener('click', e => { if (e.target === dlg()) fecharFolha(); });

route = lerRota();
if (!new URLSearchParams(location.search).has('compartilhar')) history.replaceState({ r: route }, '', urlDe(route));
render();
compartilhado();
if (!TESTE) publicarResumo();
})();

</script>
<script>
(function () {
  const TESTE = /cognitio-novo/.test(location.pathname);
  const KEY = TESTE ? 'cognitio-novo.v2' : 'cognitio.v2', DBN = TESTE ? 'cognitio-novo' : 'cognitio';
  /* versão de teste: na primeira abertura, copia os dados do Cognitio atual (só lê, nunca escreve lá) */
  function lerOriginal() {
    return new Promise(res => {
      let r; try { r = indexedDB.open('cognitio'); } catch (e) { return res(null); }
      r.onupgradeneeded = () => { try { r.transaction.abort(); } catch (e) {} };
      r.onsuccess = () => { const db = r.result; try { const q = db.transaction('kv', 'readonly').objectStore('kv').get('state'); q.onsuccess = () => { db.close(); res(typeof q.result === 'string' ? q.result : null); }; q.onerror = () => { db.close(); res(null); }; } catch (e) { db.close(); res(null); } };
      r.onerror = () => res(null);
    }).then(v => v || (() => { try { return localStorage.getItem('cognitio.v2'); } catch (e) { return null; } })());
  }
  const S = { backend: 'ls', db: null, cache: null, pending: false, writing: Promise.resolve(), lastError: null, migrated: false };
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const req = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  const txDone = tx => new Promise((ok, no) => { tx.oncomplete = () => ok(); tx.onerror = () => no(tx.error); tx.onabort = () => no(tx.error || new Error('abortada')); });
  function open() {
    return new Promise(res => {
      if (!('indexedDB' in window)) return res(null);
      let r; try { r = indexedDB.open(DBN, 1); } catch (e) { return res(null); }
      const t = setTimeout(() => res(null), 4000);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
      r.onsuccess = () => { clearTimeout(t); const db = r.result; db.onversionchange = () => { db.close(); if (S.db === db) S.db = null; }; res(db); };
      r.onerror = r.onblocked = () => { clearTimeout(t); res(null); };
    });
  }
  async function works(db) {                                  // teste real: alguns modos de abrir arquivos bloqueiam o IndexedDB
    try {
      const a = db.transaction('kv', 'readwrite'); a.objectStore('kv').put(1, '__probe'); await txDone(a);
      const b = db.transaction('kv', 'readwrite'); const v = await req(b.objectStore('kv').get('__probe')); b.objectStore('kv').delete('__probe'); await txDone(b);
      return v === 1;
    } catch (e) { return false; }
  }
  const get = k => req(S.db.transaction('kv', 'readonly').objectStore('kv').get(k));
  async function put(k, v) { const tx = S.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); await txDone(tx); }
  async function init() {
    const db = await open();
    if (!db || !(await works(db))) return;                    // segue no localStorage
    S.db = db;
    const st = await get('state'), meta = await get('__meta'), ls = lsGet(KEY);
    if (typeof st === 'string' && st) {                       // já está no IndexedDB
      S.backend = 'idb'; S.cache = st;
      if (ls && meta && meta.migrated) { try { localStorage.removeItem(KEY); } catch (e) {} }   // sobra de uma migração interrompida
      return;
    }
    if (ls) {                                                 // migração: copia, confere e só então apaga
      await put('state', ls);
      const back = await get('state');
      if (back !== ls) return;                                // não conferiu: continua no localStorage
      await put('__meta', { migrated: true, at: new Date().toISOString(), bytes: ls.length });
      S.backend = 'idb'; S.cache = ls; S.migrated = true;
      try { localStorage.removeItem(KEY); } catch (e) {}
      return;
    }
    S.backend = 'idb'; S.cache = null;                        // primeira abertura: os dados já nascem no IndexedDB
    if (TESTE) { const o = await lerOriginal(); if (o) { S.cache = o; await put('state', o); } }
    await put('__meta', { migrated: true, at: new Date().toISOString(), bytes: 0 });
  }
  let canal = null; try { canal = new BroadcastChannel(TESTE ? 'cognitio-novo-sync' : 'cognitio-sync'); } catch (e) {}
  function flush() {
    if (S.backend !== 'idb' || !S.pending || !S.db) return S.writing;
    S.pending = false; const v = S.cache;
    S.writing = S.writing.then(() => put('state', v)).then(() => {
      if (S.lastError) { S.lastError = null; api.onRecover && api.onRecover(); }
      try { canal && canal.postMessage({ t: Date.now() }); } catch (e) {}
    }).catch(e => { console.error(e); S.pending = true; if (!S.lastError) { S.lastError = e; api.onError && api.onError(e); } });
    return S.writing;
  }
  let timer = null;
  const api = {
    status: S,
    get() { return S.backend === 'idb' ? S.cache : lsGet(KEY); },
    set(v) {                                                  // no localStorage, erro de espaço continua subindo para o app
      if (S.backend === 'idb') { S.cache = v; S.pending = true; clearTimeout(timer); timer = setTimeout(flush, 0); return; }
      localStorage.setItem(KEY, v);
    },
    flush, onError: null, onRecover: null, onExternal: null,
    async recopiar() { const o = await lerOriginal(); if (o) { S.cache = o; S.pending = true; await flush(); } },
    guardarCopia(nome, v) {                                   // cópia de segurança antes de uma reorganização
      try { if (S.backend === 'idb' && S.db) { get(nome).then(x => { if (!x) put(nome, v); }).catch(() => {}); } else if (!lsGet(KEY + '.' + nome)) localStorage.setItem(KEY + '.' + nome, v); } catch (e) {}
    }
  };
  addEventListener('pagehide', () => flush());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  if (canal) canal.addEventListener('message', async () => {   // outra aba do Cognitio salvou
    if (S.backend !== 'idb' || !S.db || S.pending) return;
    try { const v = await get('state'); if (typeof v === 'string' && v !== S.cache) { S.cache = v; api.onExternal && api.onExternal(); } } catch (e) {}
  });
  window.CogStore = api;
  (async function boot() {
    try { await init(); } catch (e) { console.error(e); }
    const s = document.createElement('script');
    s.textContent = document.getElementById('cogApp').textContent;
    document.body.appendChild(s);
  })();
})();

</script>
