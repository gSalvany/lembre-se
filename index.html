<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Meus apps</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;background:#0d0e12;color:#e8e6e1;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:24px;box-sizing:border-box}
main{width:100%;max-width:420px}h1{font-weight:500;font-size:1.3rem;margin:0 0 20px;letter-spacing:.02em}
a{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;border-radius:14px;background:#181a20;color:inherit;text-decoration:none}
img{width:44px;height:44px;border-radius:10px}small{display:block;opacity:.6;margin-top:2px}.arca{margin-top:18px;border:1px solid #3a3220}.arca.due{border-color:#e3a940}.arca.due small{color:#e3a940;opacity:1}</style></head><body><main><h1>Meus apps</h1>
<a href="ludus/"><img src="ludus/icon-192.png" alt=""><div>Ludus<small>Caminhar entre os apps</small></div></a>
<a href="memento/"><img src="memento/icon-192.png" alt=""><div>Memento<small>Tempo e dinheiro</small></div></a>
<a href="volumen/"><img src="volumen/icon-192.png" alt=""><div>Volumen<small>Midiateca</small></div></a>
<a href="cognitio/"><img src="cognitio/icon-192.png" alt=""><div>Cognitio<small>Mapa de conhecimento</small></div></a>
<a href="audire/"><img src="audire/icon-192.png" alt=""><div>Audire<small>Pensamentos e ideias em voz alta</small></div></a>
<a href="atrium/"><img src="atrium/icon-192.png" alt=""><div>Atrium<small>Painel integrador</small></div></a>
<a href="arca/" class="arca"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2318140d'/%3E%3Crect x='12' y='26' width='40' height='24' rx='3' fill='%23b8945a'/%3E%3Cpath d='M12 26c0-8 9-12 20-12s20 4 20 12z' fill='%23d4b47a'/%3E%3Crect x='28' y='31' width='8' height='10' rx='2' fill='%2318140d'/%3E%3C/svg%3E" alt=""><div>Arca<small id="arcaSub">Backup de todos os apps</small></div></a>
</main><script>
try{
  const l=JSON.parse(localStorage.getItem('arca.ultimo')||'null'), a=document.querySelector('.arca'), s=document.getElementById('arcaSub');
  const d=l?Math.floor((Date.now()-l.em)/864e5):null;
  if(!l){ a.classList.add('due'); s.textContent='Nenhum backup completo ainda'; }
  else { s.textContent='Último backup '+(d<=0?'hoje':d===1?'ontem':'há '+d+' dias'); if(d>=7) a.classList.add('due'); }
}catch(e){}
</script></body></html>
